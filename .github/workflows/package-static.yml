name: Package static checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Assert PHP version
        run: php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3) { fwrite(STDERR, "PHP 8.3 is required.\n"); exit(1); }'

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Lint PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          list_file="$(mktemp "${RUNNER_TEMP}/php-files.XXXXXX")"
          trap 'rm -f "$list_file"' EXIT
          if ! git ls-files -z -- '*.php' > "$list_file"; then
            echo 'Unable to enumerate tracked PHP files.' >&2
            exit 1
          fi
          count=0
          failures=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.blade.php|vendor/*|node_modules/*) continue ;;
            esac
            count=$((count + 1))
            if [[ ! -f "$file" ]]; then
              echo "Tracked PHP file is missing: $file" >&2
              failures=$((failures + 1))
              continue
            fi
            if ! php -l "$file"; then
              failures=$((failures + 1))
            fi
          done < "$list_file"
          if (( count == 0 )); then
            echo 'No tracked plain PHP files found.' >&2
            exit 1
          fi
          printf 'Checked %d tracked plain PHP files.\n' "$count"
          if (( failures != 0 )); then
            printf 'PHP syntax lint failed for %d files.\n' "$failures" >&2
            exit 1
          fi
